{% extends 'base.html' %}

{% block title %}Add New Teacher - MarkMate{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('teachers.list_teachers') }}" class="text-decoration-none text-muted">
        <i class="bi bi-arrow-left me-1"></i> Back to Teachers Directory
    </a>
    <h3 class="fw-bold m-0 text-dark mt-2">Add New Faculty Teacher</h3>
</div>

<div class="row">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form action="{{ url_for('teachers.add_teacher') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Teacher Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Prof. Rajesh Sharma" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Login Username <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="e.g. prof.sharma" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Assigned Department <span class="text-danger">*</span></label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            {% for dept in departments %}
                                <option value="{{ dept }}">{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="e.g. sharma@markmate.edu">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter teacher password" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-rounded shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Save Teacher
                        </button>
                        <a href="{{ url_for('teachers.list_teachers') }}" class="btn btn-light btn-rounded">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
