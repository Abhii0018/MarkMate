{% extends 'base.html' %}

{% block title %}Edit Teacher - MarkMate{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('teachers.list_teachers') }}" class="text-decoration-none text-muted">
        <i class="bi bi-arrow-left me-1"></i> Back to Teachers Directory
    </a>
    <h3 class="fw-bold m-0 text-dark mt-2">Edit Faculty Teacher</h3>
</div>

<div class="row">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body p-4">
                <form action="{{ url_for('teachers.edit_teacher', id=teacher.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Teacher Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ teacher.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Login Username</label>
                        <input type="text" class="form-control bg-light" id="username" value="{{ teacher.username }}" disabled>
                        <small class="text-muted">Username cannot be modified.</small>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Assigned Department <span class="text-danger">*</span></label>
                        <select class="form-select" id="department" name="department" required>
                            {% for dept in departments %}
                                <option value="{{ dept }}" {% if teacher.department == dept %}selected{% endif %}>{{ dept }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ teacher.email or '' }}">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">New Password (Optional)</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Leave empty to keep existing password">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-rounded shadow-sm">
                            <i class="bi bi-save me-1"></i> Update Teacher
                        </button>
                        <a href="{{ url_for('teachers.list_teachers') }}" class="btn btn-light btn-rounded">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
